<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
  </head>
  <style>
    body {
      background-color: #faf9f7;
      color: #212529;
      font-family: Karla, Helvetica, Arial, sans-serif;
      font-size: 1.6rem;
      font-weight: 400;
      line-height: 1.5;
      margin: 0;
      text-align: left;
    }

    .container {
      padding-left: 4rem;
      padding-right: 4rem;
      margin-left: auto;
      margin-right: auto;
      width: 100%;
    }
  </style>
  <body>
    <div class="container">
      <h1>Internship Information</h1>
      <form>
        <label>
          Opportunity Provider
          <input placeholder="festival, dealership, etc.">
        </label>

        <label>
          Location
          <input placeholder="city, state">
        </label>

        <label>
          Start Date
          <input type="date">
        </label>

        <label>
          Length
          <input type="number">
          <select>
            <option>Days</option>
            <option>Weeks</option>
          </select>
        </label>

        <label>
          Number of interns
          <input type="number">
        </label>

        <label>
          Housing Provided
          <input type="checkbox">
        </label>

        <label>
          Meals Provided
          <input type="checkbox">
        </label>

        <label>
          Car Required
          <input type="checkbox">
        </label>

        <label>
          Compensation
          <select>
            <option>Hourly</option>
            <option>Weekly</option>
          </select>
          <input>
          Overtime
          <input type="checkbox">
        </label>

        <label>
          Application Deadline
          <input type="date">
        </label>
      </form>
    </div>
  </body>
</html>
